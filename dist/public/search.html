<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medicine search — Connect Pharma</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div id="site-header"></div>
<main class="container page-shell">
  <section class="card p-5 sm:p-6 mb-6">
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="page-eyebrow">Medicine search</p>
        <h2 class="mt-2 text-xl font-semibold leading-snug text-slate-900 sm:text-2xl">Paracetamol 650 mg Tablet</h2>
      </div>
      <button class="btn btn-primary" id="compare">Compare suppliers</button>
    </div>
    <div class="filter-grid">
      <div>
        <label class="field-label" for="q">Medicine, supplier or city</label>
        <input id="q" class="form-control" value="Paracetamol" />
      </div>
      <div>
        <label class="field-label" for="brand">Brand / generic</label>
        <select id="brand" class="form-control">
          <option value="all">All</option>
          <option value="branded">Branded</option>
          <option value="generic">Generic</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="pack">Pack size</label>
        <select id="pack" class="form-control">
          <option value="all">All pack sizes</option>
          <option value="Strip of 10">Strip of 10</option>
          <option value="Strip of 15">Strip of 15</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="distance">Maximum distance</label>
        <select id="distance" class="form-control">
          <option value="20">Within 20 km</option>
          <option value="50" selected>Within 50 km</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card overflow-hidden" id="results">
    <div class="border-b bg-slate-50 px-5 py-4 sm:px-6">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-xl font-semibold text-slate-900">Exact-match price comparison</h2>
        <span class="text-sm text-slate-600" id="count" aria-live="polite"></span>
      </div>
      <p class="notice ok hidden mt-2" id="compare-note" role="status">Comparison updated with your selected filters.</p>
      <p class="notice hidden mt-2" id="enquiry-note" role="status" aria-live="polite"></p>
    </div>
    <div id="table-area"></div>
  </section>
</main>
<script src="/assets/app.js"></script>
<script>
const q = document.getElementById('q');
const brand = document.getElementById('brand');
const pack = document.getElementById('pack');
const distance = document.getElementById('distance');
const tableArea = document.getElementById('table-area');
const count = document.getElementById('count');
const note = document.getElementById('compare-note');
const enquiryNote = document.getElementById('enquiry-note');
let all = [];
let accountRole = null;
let activeEnquiryId = null;

function fmtMoney(v) {
  const n = Number(v);
  return Number.isFinite(n) ? '₹' + n.toFixed(2) : '—';
}

function stockBadge(stock) {
  const cls = stock === 'In Stock' ? 'green' : stock === 'Low Stock' ? 'amber' : 'red';
  return `<span class="badge ${cls}">${esc(stock)}</span>`;
}

function render() {
  const maxDist = Number(distance.value);
  const canEnquire = accountRole === 'medical_shop';
  const rows = all.filter(s => s.distanceKm <= maxDist
    && (pack.value === 'all' || s.pack === pack.value)
    && (brand.value === 'all' || (brand.value === 'generic' ? s.brand === 'Generic' : s.brand !== 'Generic')));
  count.textContent = `${rows.length} supplier${rows.length === 1 ? '' : 's'} found`;
  if (!rows.length) {
    tableArea.innerHTML = '<p class="px-6 py-10 text-center text-sm text-slate-600">No suppliers match those filters. Try a broader search or distance.</p>';
    return;
  }
  tableArea.innerHTML = `<div class="table-wrap"><table class="data-table">
    <thead><tr>
      <th>Medicine</th><th>Supplier</th><th>Composition</th><th>Strength</th><th>Form / Pack</th><th>Distance</th><th>Stock</th><th>MRP</th><th>Rate</th><th>GST</th><th>Scheme</th><th>Net price</th>${canEnquire ? '<th>Enquiry</th>' : ''}
    </tr></thead>
    <tbody>${rows.map(s => `<tr>
      <td><div class="font-medium text-slate-900">${esc(s.medicineName || s.name)}</div>
          <div class="text-xs text-slate-500">${s.verified ? 'Verified licence' : 'Pending verification'}</div></td>
      <td class="text-slate-700">${esc(s.supplierName || s.name || '—')}</td>
      <td class="text-slate-700">${esc(s.composition || '—')}</td>
      <td class="text-slate-700">${esc(s.strength || '—')}</td>
      <td class="text-slate-700">${esc(s.dosageForm || '—')} · ${esc(s.pack || '—')}</td>
      <td class="text-slate-700">${s.distanceKm} km</td>
      <td>${stockBadge(s.stock)}</td>
      <td class="mono text-slate-900">${fmtMoney(s.mrp)}</td>
      <td class="mono text-slate-900">${fmtMoney(s.price)}</td>
      <td class="text-slate-700">${s.gst}%</td>
      <td class="text-slate-700">${esc(s.scheme)}</td>
      <td class="font-semibold text-brand-navy">${fmtMoney(s.netPrice ?? s.price)}</td>
      ${canEnquire ? `<td>
        <button type="button" class="btn btn-primary btn-sm" data-enquiry-toggle="${esc(s.id)}">${activeEnquiryId === s.id ? 'Cancel' : 'Enquire'}</button>
        <form class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3 ${activeEnquiryId === s.id ? '' : 'hidden'}" data-enquiry-form data-listing-id="${esc(s.id)}">
          <label class="field-label" for="enquiry-quantity-${esc(s.id)}">Quantity</label>
          <input class="form-control" id="enquiry-quantity-${esc(s.id)}" name="quantity" type="number" min="1" step="1" value="1" required />
          <label class="field-label mt-3" for="enquiry-message-${esc(s.id)}">Message (optional)</label>
          <textarea class="form-control" id="enquiry-message-${esc(s.id)}" name="message" maxlength="1000" rows="3"></textarea>
          <button type="submit" class="btn btn-primary btn-sm mt-3">Send enquiry</button>
        </form>
      </td>` : ''}
    </tr>`).join('')}</tbody></table></div>`;

  tableArea.querySelectorAll('[data-enquiry-toggle]').forEach(button => button.addEventListener('click', () => {
    activeEnquiryId = activeEnquiryId === button.dataset.enquiryToggle ? null : button.dataset.enquiryToggle;
    enquiryNote.classList.add('hidden');
    render();
  }));
  tableArea.querySelectorAll('[data-enquiry-form]').forEach(form => form.addEventListener('submit', async event => {
    event.preventDefault();
    const listingId = form.dataset.listingId;
    const quantity = Number(form.querySelector('[name="quantity"]').value);
    const message = form.querySelector('[name="message"]').value;
    try {
      await api('/api/enquiries', {
        method: 'POST',
        body: JSON.stringify({ listingId, quantity, message })
      });
      activeEnquiryId = null;
      enquiryNote.textContent = `Enquiry sent to ${all.find(offer => offer.id === listingId)?.name || 'the supplier'}.`;
      enquiryNote.className = 'notice ok mt-2';
      render();
    } catch (error) {
      enquiryNote.textContent = error instanceof Error ? error.message : 'Could not send your enquiry.';
      enquiryNote.className = 'notice error mt-2';
    }
  }));
}

window.addEventListener('connectpharma:role', event => {
  accountRole = event.detail.role;
  render();
});

async function search() {
  tableArea.innerHTML = '<p class="px-6 py-10 text-center text-sm text-slate-600">Searching suppliers...</p>';
  try {
    const params = new URLSearchParams({ query: q.value, brand: brand.value, pack: pack.value });
    all = await api('/api/search?' + params);
  } catch (e) {
    console.error(e);
    all = [];
  }
  render();
}

q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
brand.addEventListener('change', render);
pack.addEventListener('change', render);
distance.addEventListener('change', render);
document.getElementById('compare').addEventListener('click', () => {
  search().then(() => {
    note.classList.remove('hidden');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  });
});
search();
</script>
</body>
</html>
